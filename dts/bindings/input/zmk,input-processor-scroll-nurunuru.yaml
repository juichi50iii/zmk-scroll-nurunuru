description: Time-interpolated high-resolution inertial scrolling input processor
compatible: "zmk,input-processor-scroll-nurunuru"
include: base.yaml

properties:
  "#input-processor-cells":
    type: int
    required: true
    const: 0
  track-remainders:
    type: boolean
  scroll-tick:
    type: int
    default: 20
    description: Raw sensor counts per one high-resolution HID wheel unit.
  sensitivity:
    type: int
    default: 2
    description: Linear speed multiplier where 2 means 1.0x.
  response-ms:
    type: int
    default: 48
    description: Time for camera velocity to approach the measured ball velocity.
  bridge-ms:
    type: int
    default: 56
    description: Time to preserve velocity between sparse low-speed samples.
  release-ms:
    type: int
    default: 160
    description: Time constant for the gentle stop after input ends.
  invert-horizontal:
    type: boolean
  invert-vertical:
    type: boolean
