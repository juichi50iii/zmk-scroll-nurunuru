description: Time-curve animated high-resolution scrolling input processor
compatible: "zmk,input-processor-scroll-nurunuru"
include: base.yaml

properties:
  "#input-processor-cells":
    type: int
    required: true
    const: 0
  track-remainders:
    type: boolean
  base-gain:
    type: int
    default: 400
  max-gain:
    type: int
    default: 800
  acceleration-start:
    type: int
    default: 600
  acceleration-end:
    type: int
    default: 2200
  target-response:
    type: int
    default: 30
    description: Percentage used to stabilize successive measured target speeds.
  velocity-response:
    type: int
    default: 25
    description: Percentage of target camera velocity adopted per 8 ms frame.
  distance-divisor:
    type: int
    default: 2
  max-velocity-per-mille:
    type: int
    default: 2000
    description: Maximum high-resolution wheel units per 8 ms frame, in thousandths.
  coast-velocity-per-mille:
    type: int
    default: 400
    description: Fraction of the live velocity retained when a flick begins.
  low-speed-response:
    type: int
    default: 60
    description: Percentage of target velocity adopted per frame below 0.25 units.
  launch-ms:
    type: int
    default: 96
    description: Time spent in stage A before stage B becomes the minimum live speed.
  release-ms:
    type: int
    default: 48
    description: Sensor gap tolerated before beginning the release curve.
  stage-thresholds:
    type: array
    required: true
    description: Six ascending ball-speed boundaries selecting stages A through G.
  stage-velocities-per-mille:
    type: array
    required: true
    description: Seven S-curve camera velocities in thousandths of a wheel unit per frame.
  stage-hysteresis-per-mille:
    type: int
    default: 800
    description: Fraction of each upward boundary used when returning to a slower stage.
  low-stage-max-gap-ms:
    type: array
    required: true
    description: Maximum time without a report at stages A, B, and C before one predictive step.
  stage-coast-ms:
    type: array
    required: true
    description: Seven stage-specific coast durations; zero disables coasting for that stage.
  invert-horizontal:
    type: boolean
  invert-vertical:
    type: boolean
