description: Time-based accelerated inertial scrolling input processor

compatible: "zmk,input-processor-scroll-nurunuru"

include: base.yaml

properties:
  "#input-processor-cells":
    type: int
    required: true
    const: 0

  track-remainders:
    type: boolean
    description: Required by the ZMK input listener remainder tracker.

  base-gain:
    type: int
    default: 700
    description: Low-speed gain in per-mille units.

  max-gain:
    type: int
    default: 4500
    description: High-speed gain in per-mille units.

  acceleration-start:
    type: int
    default: 40
    description: Raw counts per second where acceleration begins.

  acceleration-end:
    type: int
    default: 600
    description: Raw counts per second where maximum gain is reached.

  response:
    type: int
    default: 30
    description: Percentage of target velocity adopted per 8 ms frame (1-100).

  drag-per-mille:
    type: int
    default: 940
    description: Velocity retained per 8 ms frame after input stops (0-999).

  stop-threshold:
    type: int
    default: 150
    description: Fixed-point velocity below which inertia stops.

  invert-horizontal:
    type: boolean

  invert-vertical:
    type: boolean
