description: PMW3610-style sigmoid scroll acceleration input processor
compatible: "zmk,input-processor-scroll-nurunuru"
include: base.yaml

properties:
  "#input-processor-cells":
    type: int
    required: true
    const: 0
  track-remainders:
    type: boolean
  scroll-tick:
    type: int
    default: 20
    description: Raw sensor counts required for one high-resolution wheel event.
  sensitivity:
    type: int
    default: 2
    description: Sigmoid acceleration sensitivity from 1 to 10.
  invert-horizontal:
    type: boolean
  invert-vertical:
    type: boolean
