description: Queued easing inertial scrolling input processor

compatible: "zmk,input-processor-scroll-nurunuru"

include: base.yaml

properties:
  "#input-processor-cells":
    type: int
    required: true
    const: 0

  track-remainders:
    type: boolean

  base-gain:
    type: int
    default: 800
    description: Low-speed distance gain in per-mille units.

  max-gain:
    type: int
    default: 1200
    description: High-speed distance gain in per-mille units.

  acceleration-start:
    type: int
    default: 350
    description: Raw counts per second where distance acceleration begins.

  acceleration-end:
    type: int
    default: 1500
    description: Raw counts per second where maximum distance gain is reached.

  response:
    type: int
    default: 18
    description: Percentage of queued distance requested per 8 ms animation frame.

  input-filter-response:
    type: int
    default: 25
    description: Percentage of target animation velocity adopted per frame.

  distance-divisor:
    type: int
    default: 2
    description: Divides input distance after gain; higher values scroll less.

  max-velocity:
    type: int
    default: 3
    description: Maximum high-resolution wheel units emitted per 8 ms frame.

  invert-horizontal:
    type: boolean

  invert-vertical:
    type: boolean
