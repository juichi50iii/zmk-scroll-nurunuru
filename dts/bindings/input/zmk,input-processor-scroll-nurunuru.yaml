description: >
  Fixed-rate smooth scrolling input processor for ZMK.

  The processor consumes relative X and Y input events, accumulates their
  values, and emits horizontal and vertical scroll reports at a fixed
  interval.

compatible: "zmk,input-processor-scroll-nurunuru"

include: base.yaml

properties:
  "#input-processor-cells":
    type: int
    required: true
    const: 0

  track-remainders:
    type: boolean
    description: >
      Indicates whether the ZMK input listener should allocate remainder
      storage for this processor.

  report-interval-ms:
    type: int
    default: 8
    description: >
      Interval in milliseconds between generated scroll reports.

  horizontal-divisor:
    type: int
    default: 15
    description: >
      Raw movement required to generate one horizontal scroll unit.

  vertical-divisor:
    type: int
    default: 15
    description: >
      Raw movement required to generate one vertical scroll unit.

  velocity-smoothing:
    type: int
    default: 40
    description: >
      Percentage of the newest input velocity applied each frame.
      Higher values respond faster. Lower values produce smoother motion.
      Valid range is 1 to 100.

  idle-timeout-ms:
    type: int
    default: 40
    description: >
      Stop the periodic worker after this amount of time without physical
      input.

  invert-horizontal:
    type: boolean
    description: >
      Invert horizontal scrolling.

  invert-vertical:
    type: boolean
    description: >
      Invert vertical scrolling.

  acceleration-start:
    type: int
    default: 2
    description: >
      Raw movement per frame at which acceleration begins.

  acceleration-end:
    type: int
    default: 12
    description: >
      Raw movement per frame at which maximum acceleration is reached.

  max-gain-percent:
    type: int
    default: 300
    description: >
      Maximum scrolling gain in percent.
      100 means no acceleration and 300 means three times the base speed.