description: Experimental virtual two-finger touchpad input processor
compatible: "zmk,input-processor-scroll-nurunuru"
include: base.yaml

properties:
  "#input-processor-cells":
    type: int
    required: true
    const: 0
  track-remainders:
    type: boolean
  touch-scale:
    type: int
    default: 12
    description: Absolute touchpad coordinate movement per raw sensor count.
  invert-horizontal:
    type: boolean
  invert-vertical:
    type: boolean
