description: Smooth inertial scrolling input processor

compatible: "zmk,input-processor-scroll-nurunuru"

include: base.yaml

properties:
  scroll-scale:
    type: int
    default: 7
    description: Scroll fineness from 1 to 10. Higher is finer and slower.

  hover:
    type: int
    default: 4
    description: >
      Initial low-speed push from 1 to 10.
      Higher values create a stronger floating start.

  acceleration:
    type: int
    default: 10
    description: Acceleration strength from 1 to 10.

  inertia:
    type: int
    default: 8
    description: Coasting strength from 1 to 10. Higher glides longer.

  brake:
    type: int
    default: 3
    description: End braking strength from 1 to 10. Higher stops more strongly.

  track-remainders:
    type: boolean

  invert-horizontal:
    type: boolean

  invert-vertical:
    type: boolean